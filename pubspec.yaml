name: restaurant_management_system
description: Production-grade Restaurant Management System — Flutter frontend.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"  # Updated the lower bound to 3.8.0
  flutter: ">=3.22.0"


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter



  # ── State management ──────────────────────────────────────────────
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # ── Navigation ────────────────────────────────────────────────────
  go_router: ^17.3.0

  # ── Network ───────────────────────────────────────────────────────
  dio: ^5.4.3+1
  connectivity_plus: ^7.1.1

  # ── Serialization / models ────────────────────────────────────────
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # ── Local storage ─────────────────────────────────────────────────
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^10.3.1

  # ── Forms ─────────────────────────────────────────────────────────
  reactive_forms: ^18.2.2

  # ── UI ────────────────────────────────────────────────────────────
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  qr_flutter: ^4.1.0
  fl_chart: ^1.2.0
  badges: ^3.1.2
  intl: ^0.20.2  # Update this line

  # ── Utilities ─────────────────────────────────────────────────────
  equatable: ^2.0.5
  dartz: ^0.10.1
  logger: ^2.3.0
  package_info_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ── Code generation ───────────────────────────────────────────────
  build_runner: ^2.4.11
  riverpod_generator: ^4.0.0+1
  freezed: ^3.2.3
  json_serializable: ^6.8.0
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0

  # ── Lint ──────────────────────────────────────────────────────────
  flutter_lints: ^6.0.0
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
